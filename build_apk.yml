
name: Build HackEnginePro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Extract assets
        run: |
          if [ -f assets.zip ]; then
            mkdir -p assets
            unzip -o assets.zip -d /tmp/hackengine-assets
            ICON=$(find /tmp/hackengine-assets -type f -iname "icon.png" -print -quit)
            if [ -n "$ICON" ]; then
              cp "$ICON" assets/icon.png
            fi
          fi

      - name: Check project files
        run: |
          test -f pyproject.toml
          test -f app.py
          test -f vision_engine.py

      - name: Build APK
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.12"
          bundled-python-version: "3.12"
          build-number: ${{ github.run_number }}
          cache: false

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
