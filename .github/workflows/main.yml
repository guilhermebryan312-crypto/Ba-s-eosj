
name: Build HackEnginePro APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check project files
        run: |
          echo "Checking project..."
          test -f pyproject.toml
          test -f app.py
          test -f vision_engine.py
          echo "Project files found!"

      - name: Build APK with Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.14"
          bundled-python-version: "3.14"
          build-number: ${{ github.run_number }}
          cache: false

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: HackEnginePro-APK
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
